version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - staticcheck
    - gosec
    - revive
    - misspell
  settings:
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

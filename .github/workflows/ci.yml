name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
      - name: Test with coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "### Test coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: make build
      - name: Smoke test (demo over stdio)
        run: |
          # Keep stdin open briefly: the server exits as soon as stdin closes.
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"cluster_overview","arguments":{}}}'; sleep 2; } \
            | timeout 10 ./bin/edge-mcp --demo | tee out.jsonl
          grep -q '"nodes_needing_attention":\["blr-02"\]' out.jsonl

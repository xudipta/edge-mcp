name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="edge-mcp_${VERSION}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/xudipta/edge-mcp/internal/server.Version=${VERSION}" \
              -o "build/${name}/edge-mcp${ext}" ./cmd/edge-mcp
            cp LICENSE README.md "build/${name}/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -C build -czf "dist/${name}.tar.gz" "${name}"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Check the linux/amd64 binary reports the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tar -xzf "dist/edge-mcp_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/edge-mcp_${VERSION}_linux_amd64/edge-mcp" --version | tee /dev/stderr | grep -qF "$VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag
